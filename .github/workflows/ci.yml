name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell 语法检查
        run: |
          set -euo pipefail
          for f in install.sh skills/*/scripts/*.sh; do
            bash -n "$f"
          done

      - name: Python 语法与入口冒烟
        run: |
          python3 -m py_compile skills/kit-gh-stars/scripts/gen-index.py skills/kit-project-hub/scripts/gen-hub.py
          python3 skills/kit-gh-stars/scripts/gen-index.py --help >/dev/null
          python3 skills/kit-project-hub/scripts/gen-hub.py --help >/dev/null

      - name: Node 语法检查
        run: |
          node --check skills/kit-shotframe/scripts/frame.js
          node --check skills/kit-capture/scripts/interact.cjs

      - name: kit-shotframe 逻辑单测（纯 Node，无 Chromium）
        run: node --test "skills/kit-shotframe/test/*.test.cjs"

      - name: kit-capture 入口冒烟（模式分发 + 参数校验，无外部依赖）
        run: |
          set +e
          bash skills/kit-capture/scripts/capture.sh >/dev/null 2>&1; test $? -eq 2
          bash skills/kit-capture/scripts/capture.sh bogus >/dev/null 2>&1; test $? -eq 2
          bash skills/kit-capture/scripts/capture.sh browser >/dev/null 2>&1; test $? -eq 2
          echo "kit-capture 入口检查通过"

      - name: kit-shotframe 新参数契约（纯 Node，无 Chromium）
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"

          # --list --json 应给出全部合法取值（agent 靠它发现能力，别让人猜）
          node skills/kit-shotframe/scripts/frame.js --list --json > "$tmp/list.json"
          node -e '
            const j = require(process.argv[1]);
            for (const k of ["aurora", "sky", "mono"]) if (!j.backgrounds.includes(k)) throw new Error("missing bg " + k);
            for (const k of ["og", "twitter", "instagram", "story"]) if (!j.ratios.includes(k)) throw new Error("missing ratio " + k);
            for (const k of ["iphone", "ipad", "macbook"]) if (!j.devices.includes(k)) throw new Error("missing device " + k);
            // 回执顶层字段必须成套：成功也要带 exitCode，agent 才能统一判断而不会误判成功为失败
            if (j.ok !== true || j.exitCode !== 0 || j.command !== "frame") throw new Error("list 回执顶层字段不齐");
          ' "$tmp/list.json"

          # 非法取值必须 exit 2 + 稳定 error.code（而不是静默按默认值渲染出错误产物）
          set +e
          out="$(node skills/kit-shotframe/scripts/frame.js --input docs/screenshots/browser-example.png \
                  --bg nope --output "$tmp/x.png" --json 2>/dev/null)"
          code=$?
          set -e
          test "$code" -eq 2
          echo "$out" | grep -q '"config/unknown-background"'

          # 数值参数写错也必须明确失败（`--padding 5O` 用字母 O 不能静默变成默认 56）
          set +e
          node skills/kit-shotframe/scripts/frame.js --input docs/screenshots/browser-example.png \
            --padding 5O --output "$tmp/x.png" --json > "$tmp/badnum.json" 2>/dev/null
          test "$?" -eq 2
          set -e
          grep -q '"config/invalid-padding"' "$tmp/badnum.json"

          # 资源守卫：极端 --ratio / --padding 必须快速失败，而不是让 Chromium 卡满 60s 超时
          set +e
          node skills/kit-shotframe/scripts/frame.js --input docs/screenshots/browser-example.png \
            --ratio 100:1 --output "$tmp/x.png" --json > "$tmp/big.json" 2>/dev/null
          test "$?" -eq 2
          set -e
          grep -q '"config/canvas-too-large"' "$tmp/big.json"
          echo "契约检查通过"

      - name: kit-shotframe 端到端渲染冒烟（系统 Chromium 可用时）
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          frame() { node skills/kit-shotframe/scripts/frame.js "$@"; }
          if ! frame --input docs/screenshots/browser-example.png \
               --preset macos --output "$tmp/framed.png" 2>"$tmp/err"; then
            if grep -q "未找到 Chromium" "$tmp/err"; then echo "⚠ 未找到 Chromium，跳过渲染冒烟"; exit 0; fi
            cat "$tmp/err"; exit 1
          fi
          test -s "$tmp/framed.png"

          # --ratio + --width：宽度精确落到 600，且画布比例确实为 1.91:1
          frame --input docs/screenshots/browser-example.png --preset browser --bg aurora \
            --ratio og --width 600 --output "$tmp/og.png" --json > "$tmp/og.json"
          node -e '
            const j = require(process.argv[1]);
            const o = j.outputs[0];
            if (!j.ok) throw new Error("ok=false");
            if (o.width !== 600) throw new Error("width=" + o.width);
            const r = o.width / o.height;
            if (Math.abs(r - 1.91) > 0.05) throw new Error("ratio=" + r);
            if (j.background.variants[0] !== "aurora") throw new Error("bg variant lost");
          ' "$tmp/og.json"

          # --transparent：输出应为 RGBA（IHDR colorType = 6）
          frame --input docs/screenshots/browser-example.png --preset macos \
            --transparent --output "$tmp/t.png" >/dev/null
          node -e '
            const b = require("fs").readFileSync(process.argv[1]);
            if (b[25] !== 6) throw new Error("expected RGBA(6), got colorType " + b[25]);
          ' "$tmp/t.png"

          echo "rendered $(wc -c < "$tmp/framed.png") bytes; og=$(wc -c < "$tmp/og.png") bytes"

      - name: install.sh 冒烟（临时目录，不触碰真实 HOME）
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          OPENCODE_SKILLS_DIR="$tmp/opencode" CLAUDE_SKILLS_DIR="$tmp/claude" \
            ./install.sh kit-shotframe kit-gh-pages >/dev/null
          test -L "$tmp/opencode/kit-shotframe" && test -L "$tmp/claude/kit-shotframe"
          test -L "$tmp/opencode/kit-gh-pages" && test -L "$tmp/claude/kit-gh-pages"
          # 无参 = 安装全部；装出来的数量应与 skills/ 下的目录数一致
          tmp2="$(mktemp -d)"
          OPENCODE_SKILLS_DIR="$tmp2/opencode" CLAUDE_SKILLS_DIR="$tmp2/claude" ./install.sh >/dev/null
          expected="$(find skills -mindepth 1 -maxdepth 1 -type d | wc -l)"
          test "$(ls -1 "$tmp2/opencode" | wc -l)" -eq "$expected"
          test "$(ls -1 "$tmp2/claude" | wc -l)" -eq "$expected"

      - name: 生成器冒烟（真实 fixture）
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          printf '%s\n' '[{"full_name":"a/b","description":"d","language":"Python","stargazers_count":1,"topics":["ai"],"html_url":"https://github.com/a/b"}]' > "$tmp/stars.json"
          python3 skills/kit-gh-stars/scripts/gen-index.py "$tmp/stars.json" "$tmp/index.html" --title T
          grep -q 'class="card"' "$tmp/index.html"
          printf '%s\n' '[{"name":"r1","description":"d","language":"Go","stargazersCount":2,"updatedAt":"2024-01-01","isFork":false,"isArchived":false,"url":"https://github.com/o/r","homepageUrl":null}]' > "$tmp/repos.json"
          python3 skills/kit-project-hub/scripts/gen-hub.py "$tmp/repos.json" "$tmp/hub.html" --title H --owner o
          grep -q 'class="card"' "$tmp/hub.html"

      - name: 生成器缺字段容错（html_url / url 缺失时回退拼接）
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          # kit-gh-stars：缺 html_url 不崩溃，回退 https://github.com/<full_name>
          printf '%s\n' '{"starred_at":"2024-01-01T00:00:00Z","full_name":"a/b","description":"d","language":"Python","stargazers_count":1,"topics":[],"fork":false}' > "$tmp/stars2.jsonl"
          python3 skills/kit-gh-stars/scripts/gen-index.py "$tmp/stars2.jsonl" "$tmp/index2.html" --title T
          grep -q 'href="https://github.com/a/b"' "$tmp/index2.html"
          # kit-gh-stars：JSONL 中混入坏行不崩溃，跳过即可
          printf '%s\n' 'not-json' '{"starred_at":"2024-01-02T00:00:00Z","full_name":"c/d","description":"d","language":"Go","stargazers_count":2,"topics":["docker"],"fork":true,"html_url":"https://github.com/c/d"}' > "$tmp/stars3.jsonl"
          python3 skills/kit-gh-stars/scripts/gen-index.py "$tmp/stars3.jsonl" "$tmp/index3.html" --title T 2>/dev/null
          grep -q 'href="https://github.com/c/d"' "$tmp/index3.html"
          # kit-project-hub：url 缺失时用 --owner 拼出带 owner 的正确链接
          printf '%s\n' '[{"name":"r2","description":"d","language":"Go","stargazersCount":2,"updatedAt":"2024-01-01","fork":false,"archived":false}]' > "$tmp/repos2.json"
          python3 skills/kit-project-hub/scripts/gen-hub.py "$tmp/repos2.json" "$tmp/hub2.html" --title H --owner o
          grep -q 'href="https://github.com/o/r2"' "$tmp/hub2.html"

      - name: 生成器缺字段/脏数据容错（缺 name、非数值 star 不崩溃）
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          # kit-project-hub：缺 name 的记录应被跳过而非 KeyError 崩溃
          printf '%s\n' '[{"name":"ok1","description":"d","language":"Go","stargazersCount":3,"updatedAt":"2024-01-01","fork":false,"archived":false},{"description":"no-name","language":"Rust","stargazersCount":1,"updatedAt":"2024-01-01","fork":false,"archived":false}]' > "$tmp/repos-noname.json"
          python3 skills/kit-project-hub/scripts/gen-hub.py "$tmp/repos-noname.json" "$tmp/hub-noname.html" --title H --owner o
          grep -q 'ok1' "$tmp/hub-noname.html"
          ! grep -q 'no-name' "$tmp/hub-noname.html"
          # 非数值 star（外部数据常见脏值）不崩溃：kit-gh-stars 与 kit-project-hub 都要扛住
          printf '%s\n' '{"starred_at":"2024-01-01T00:00:00Z","full_name":"a/b","description":"d","language":"Python","stargazers_count":"1.2k","topics":[],"fork":false}' > "$tmp/stars-str.jsonl"
          python3 skills/kit-gh-stars/scripts/gen-index.py "$tmp/stars-str.jsonl" "$tmp/index-str.html" --title T
          grep -q 'class="card"' "$tmp/index-str.html"
          printf '%s\n' '[{"name":"s1","description":"d","language":"Go","stargazersCount":"1.2k","updatedAt":"2024-01-01","fork":false,"archived":false}]' > "$tmp/repos-str.json"
          python3 skills/kit-project-hub/scripts/gen-hub.py "$tmp/repos-str.json" "$tmp/hub-str.html" --title H --owner o
          grep -q 'class="card"' "$tmp/hub-str.html"

  # 跨平台回归：Windows / macOS 上验证 Node 工具链与安装器（ubuntu 由上面的 smoke 覆盖）
  cross-platform:
    name: cross-platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Node 语法检查
        shell: bash
        run: |
          node --check skills/kit-shotframe/scripts/frame.js
          node --check skills/kit-capture/scripts/interact.cjs

      - name: kit-shotframe 逻辑单测（纯 Node，无 Chromium）
        shell: bash
        # 不加引号，由 shell 展开 glob：Node 20 的 --test 自身不支持 glob 模式
        run: node --test skills/kit-shotframe/test/*.test.cjs

      # 契约检查不依赖 Chromium：配置错误必须先于环境错误报出，且 error.code 跨平台一致
      - name: kit-shotframe 新参数契约（无 Chromium 依赖）
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-out
          node skills/kit-shotframe/scripts/frame.js --list --json > .ci-out/list.json
          node -e '
            const j = require("./.ci-out/list.json");
            if (!j.backgrounds.includes("aurora")) throw new Error("missing aurora");
            if (!j.ratios.includes("og")) throw new Error("missing og");
          '
          set +e
          out="$(node skills/kit-shotframe/scripts/frame.js --input docs/screenshots/browser-example.png \
                  --bg nope --output .ci-out/x.png --json 2>/dev/null)"
          code=$?
          set -e
          test "$code" -eq 2
          echo "$out" | grep -q '"config/unknown-background"'
          echo "跨平台契约检查通过"

      # 注意：Windows 的 Git Bash 里 mktemp 得到的是 MSYS 路径，原生 node.exe 解析结果不同，
      # 因此这里统一用仓库内相对路径，保证 bash 与 node 指向同一位置。
      - name: kit-shotframe 端到端渲染冒烟（系统 Chromium 可用时）
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-out
          if ! node skills/kit-shotframe/scripts/frame.js --input docs/screenshots/browser-example.png \
               --preset macos --output .ci-out/framed.png 2>.ci-out/render.log; then
            if grep -q "未找到 Chromium" .ci-out/render.log; then echo "⚠ 未找到 Chromium，跳过渲染冒烟"; exit 0; fi
            cat .ci-out/render.log; exit 1
          fi
          test -s .ci-out/framed.png
          echo "rendered $(wc -c < .ci-out/framed.png) bytes"

      - name: "安装器冒烟（Windows: install.ps1 目录联接）"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'ask-install'
          $env:OPENCODE_SKILLS_DIR = Join-Path $tmp 'opencode'
          $env:CLAUDE_SKILLS_DIR = Join-Path $tmp 'claude'
          # 无参 = 安装全部（回归：PowerShell 里 @($null).Count 是 1 不是 0，曾导致无参直接报错）
          ./install.ps1
          $expected = (Get-ChildItem skills -Directory).Count
          $got = (Get-ChildItem $env:OPENCODE_SKILLS_DIR).Count
          if ($got -ne $expected) { throw "install.ps1 无参应装全部：期望 $expected，实际 $got" }
          ./install.ps1 kit-shotframe kit-gh-pages
          $ok = (Test-Path (Join-Path $env:OPENCODE_SKILLS_DIR 'kit-shotframe\SKILL.md')) -and
                (Test-Path (Join-Path $env:CLAUDE_SKILLS_DIR 'kit-gh-pages\SKILL.md'))
          if (-not $ok) { throw 'install.ps1 未正确创建目录联接' }
          ./install.ps1  # 幂等复跑应全部跳过

      - name: "安装器冒烟（macOS: install.sh 需要 bash ≥ 4.4）"
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install bash
          BASH="$(brew --prefix)/bin/bash"
          tmp="$(mktemp -d)"
          OPENCODE_SKILLS_DIR="$tmp/opencode" CLAUDE_SKILLS_DIR="$tmp/claude" \
            "$BASH" ./install.sh kit-shotframe kit-gh-pages
          test -L "$tmp/opencode/kit-shotframe" && test -L "$tmp/claude/kit-gh-pages"
          # 无参 = 安装全部
          tmp2="$(mktemp -d)"
          OPENCODE_SKILLS_DIR="$tmp2/opencode" CLAUDE_SKILLS_DIR="$tmp2/claude" "$BASH" ./install.sh >/dev/null
          expected="$(find skills -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          test "$(ls -1 "$tmp2/opencode" | wc -l | tr -d ' ')" = "$expected"
