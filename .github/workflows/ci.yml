name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    name: Offline checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Image validation dependency
        run: python -m pip install Pillow
      - name: Metadata, references, all script contracts and offline regressions
        env:
          PYTHONUTF8: '1'
        run: python tools/check.py
      - name: Windows junction installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'ask-install'
          $env:CODEX_SKILLS_DIR = Join-Path $tmp 'codex'
          $env:OPENCODE_SKILLS_DIR = Join-Path $tmp 'opencode'
          $env:CLAUDE_SKILLS_DIR = Join-Path $tmp 'claude'
          ./install.ps1 -DryRun
          if (Test-Path $tmp) { throw 'DryRun wrote files' }
          ./install.ps1
          ./install.ps1
          $expected = (Get-ChildItem skills -Directory).Count
          foreach ($target in @($env:CODEX_SKILLS_DIR, $env:OPENCODE_SKILLS_DIR, $env:CLAUDE_SKILLS_DIR)) {
            if ((Get-ChildItem $target).Count -ne $expected) { throw 'Incomplete installation' }
            if (-not (Test-Path (Join-Path $target 'kit-capture/SKILL.md'))) { throw 'Invalid junction' }
          }
          # Updating a junction must leave its old target intact.
          $old = Join-Path $tmp 'old'
          New-Item -ItemType Directory -Path $old | Out-Null
          Set-Content (Join-Path $old 'keep.txt') 'keep'
          $link = Join-Path $env:CODEX_SKILLS_DIR 'kit-capture'
          [System.IO.Directory]::Delete($link)
          New-Item -ItemType Junction -Path $link -Target $old | Out-Null
          ./install.ps1 -Agent codex kit-capture
          if (-not (Test-Path (Join-Path $old 'keep.txt'))) { throw 'Old target was modified' }

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - run: python -m pip install Pillow
      - name: Real cover and screenshot rendering with local fixtures
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          KIT_SHOTFRAME_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          python skills/kit-gzh-article-pipeline/tests/regression.py
          python tests/render_smoke.py
